server:
  port: ${SERVER_PORT:8002}

spring:
  application:
    name: banma-interview-server
  # ── 关闭 Spring AI 自动配置（2026-11-12）──
  # 本项目 AI 调用走 Python Agent（ADR-004）；legacy 的通用对话模块
  # （UniversalAiChatHandler）是手动 new OpenAiChatModel / DeepSeekChatModel，
  # 从 ai_properties 表读配置，不依赖自动装配出来的 Bean。
  # 不排除的后果：自动配置会在启动时创建 OpenAiAudioSpeechModel 等 Bean 并要求
  # spring.ai.openai.api-key 非空 —— 表现为"项目没用 OpenAI，却因 OpenAI 起不来"。
  autoconfigure:
    exclude:
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
  # ── 邮箱验证码 SMTP──
  # 凭证走环境变量（.env 经 compose env_file 注入），yaml 不留真值
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_AUTH_CODE:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true          # 465 端口必须 SSL
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  config:
    # ── .env 分层（与 Python 端同构，2026-11-12 定稿）──
    #   .env              公共项（≈ Python 的 .env / Spring 的 application.yml）
    #   .env.{BANMA_ENV}  环境差异项（≈ application-{env}.yml），BANMA_ENV 取 local / test / prod
    # 覆盖顺序（后者优先）：application.yaml < .env < .env.{BANMA_ENV} < 真实环境变量
    #
    # 为什么写两组路径：IDEA 默认工作目录是模块目录（admin/），
    # 而命令行在仓库根执行——`./` 与 `../` 各覆盖一种，缺的那个被 optional 忽略。
    # [.properties] 是告诉 Spring 用 properties 语法解析这个无扩展名文件。
    import:
      - optional:classpath:interview-followup-rule.yaml
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:./.env.${BANMA_ENV:local}[.properties]
      - optional:file:../.env.${BANMA_ENV:local}[.properties]
  profiles:
    include: satoken,sse
  servlet:
    multipart:
      location: ${BANMA_MULTIPART_TEMP_DIR:${banma-interview.storage.upload-temp-dir}}
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:banma_interview}?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=${APP_TIMEZONE:Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  data:
    mongodb:
      host: ${MONGODB_HOST:127.0.0.1}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DATABASE:banma_interview}
      # username: ${MONGODB_USERNAME:}
      # password: ${MONGODB_PASSWORD:}
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
        shutdown-timeout: 100ms
      timeout: 10000ms
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: redis-session-task-
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100
        thread-name-prefix: redis-session-async-
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    defaults:
      enabled: true

logging:
  file:
    path: ${BANMA_LOG_DIR:${banma-interview.storage.log-dir}}

collection:
  vector:
    similarity-threshold: 0.9

banma-interview:
  security:
  storage:
    base-dir: ${BANMA_STORAGE_BASE_DIR:${user.home}/.banma-interview}
    upload-temp-dir: ${BANMA_MULTIPART_TEMP_DIR:${banma-interview.storage.base-dir}/temp/upload}
    audio-temp-dir: ${BANMA_AUDIO_TEMP_DIR:${banma-interview.storage.base-dir}/temp/audio}
    log-dir: ${BANMA_LOG_DIR:${banma-interview.storage.base-dir}/logs}
  thread-pool:
    general:
      core-pool-size: 50
      max-pool-size: 200
      queue-capacity: 1000
      keep-alive-seconds: 300
      thread-name-prefix: banma-async-
    ai-io:
      core-pool-size: 24
      max-pool-size: 64
      queue-capacity: 400
      keep-alive-seconds: 120
      thread-name-prefix: banma-ai-io-
    cpu:
      core-pool-size: 8
      max-pool-size: 16
      queue-capacity: 256
      keep-alive-seconds: 60
      thread-name-prefix: banma-cpu-
    query:
      core-pool-size: 16
      max-pool-size: 48
      queue-capacity: 600
      keep-alive-seconds: 120
      thread-name-prefix: banma-query-
    scheduled-pool-size: 8
    scheduled-thread-name-prefix: banma-schedule-
  agent-binding:
    general-agent-chat: ${BANMA_AGENT_GENERAL_CHAT:通用智能体}
    interview-question-extraction: ${BANMA_AGENT_INTERVIEW_QUESTION_EXTRACTION:面试出题官}
    interview-answer-evaluation: ${BANMA_AGENT_INTERVIEW_ANSWER_EVALUATION:用户答案评分官}
    interview-demeanor: ${BANMA_AGENT_INTERVIEW_DEMEANOR:神态分析官}
    interview-question-asking: ${BANMA_AGENT_INTERVIEW_QUESTION_ASKING:面试提问官}
  flow-limit:
    enable: true
    time-window-seconds: 1
    max-access-count: 20
    requested-tokens: 1
    interview-answer-time-window-seconds: 1
    interview-answer-max-access-count: 8
    interview-heavy-time-window-seconds: 1
    interview-heavy-max-access-count: 2
    interview-read-time-window-seconds: 1
    interview-read-max-access-count: 15
    interview-ai-call-time-window-seconds: 1
    interview-ai-call-max-access-count: 6
  ai-guard:
    enable: true
    circuit-sliding-window-size: 50
    circuit-failure-rate-threshold: 50
    circuit-permitted-calls-in-half-open-state: 10
    circuit-open-state-wait-millis: 30000
    executor-threads: 32
    stages:
      interview-evaluation:
        timeout-millis: 20000
        max-concurrent-calls: 30
        retry-count: 1
        retry-wait-millis: 100
      interview-followup:
        timeout-millis: 20000
        max-concurrent-calls: 20
        retry-count: 1
        retry-wait-millis: 100
      interview-extraction:
        timeout-millis: 60000
        max-concurrent-calls: 8
        retry-count: 0
        retry-wait-millis: 0
      interview-demeanor:
        timeout-millis: 20000
        max-concurrent-calls: 6
        retry-count: 0
        retry-wait-millis: 0
  ai-singleflight:
    enable: true
    mode: hybrid
    distributed-enabled: true
    ttl-millis: 65000
    wait-timeout-millis: 65000
    stream-block-timeout-millis: 3000
    poll-fallback-interval-millis: 2000
    follower-max-wait-millis: 20000
    l1-cache-max-size: 1000
    cleanup-threshold: 256
    heavy-lock-expire-seconds: 90
    heavy-lock-wait-millis: 0
    stage-policies:
      interview-evaluation:
        heartbeat-interval-millis: 3000
        running-ttl-millis: 15000
        takeover-detect-millis: 10000
        result-ttl-millis: 600000
        failed-result-ttl-millis: 60000
        compression-threshold-bytes: 4096
        compression-codec: gzip
        l1-cache-enabled: true
        l1-cache-ttl-millis: 30000
      interview-followup:
        heartbeat-interval-millis: 2500
        running-ttl-millis: 12000
        takeover-detect-millis: 8000
        result-ttl-millis: 180000
        failed-result-ttl-millis: 30000
        compression-threshold-bytes: 2048
        compression-codec: gzip
        l1-cache-enabled: true
        l1-cache-ttl-millis: 15000
      interview-extraction:
        heartbeat-interval-millis: 4000
        running-ttl-millis: 20000
        takeover-detect-millis: 12000
        result-ttl-millis: 1800000
        failed-result-ttl-millis: 60000
        compression-threshold-bytes: 1024
        compression-codec: gzip
        l1-cache-enabled: true
        l1-cache-ttl-millis: 60000
      interview-demeanor:
        heartbeat-interval-millis: 5000
        running-ttl-millis: 30000
        takeover-detect-millis: 15000
        result-ttl-millis: 900000
        failed-result-ttl-millis: 60000
        compression-threshold-bytes: 2048
        compression-codec: gzip
        l1-cache-enabled: false
  interview:
    answer-guard:
      lock-expire-seconds: -1
      lock-watchdog-enabled: true
      processing-expire-seconds: 120
      processing-long-tail-expire-seconds: 300
      replay-expire-hours: 24
      lock-wait-millis: 0
    turn-repair:
      enable: true
      fixed-delay-millis: 3000
      batch-size: 50
      max-retries: 6
  redis-session:
    enable: true
    message-expire-seconds: 604800
    sync-delay-seconds: 30
    batch-sync-size: 100
    max-queue-size: 10000
    clean-interval-seconds: 300

# ── 邮箱验证码业务参数（2026-11-11 登录改造）──
banma:
  mail:
    code-ttl-minutes: 5                 # 验证码有效期（分钟）
    send-interval-seconds: 60           # 同邮箱发送间隔（秒）
