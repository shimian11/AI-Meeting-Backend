name: backend-ci

# 仅允许手动触发
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify repository
        # 运行器已预装 Maven（setup-java 已配缓存）；本项目无 mvnw，直接用 mvn
        run: mvn -B -ntp clean verify -Dmaven.test.skip=true
